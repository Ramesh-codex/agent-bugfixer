name: CI

on:
  push:
  pull_request:

# Read-only token; no secrets are used by any job.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (no API, no network calls)
    runs-on: ubuntu-latest
    env:
      # Explicitly empty: the suite must never depend on real credentials.
      ANTHROPIC_API_KEY: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  verify-zoo:
    name: Sandbox image + bug zoo verification (Docker only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build sandbox image
        run: docker build -t bugzoo-sandbox -f sandbox/Dockerfile sandbox
      - name: Verify every bug fails and the base passes
        run: python scripts/verify_zoo.py
